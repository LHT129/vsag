name: Performance

on:
  schedule:
    - cron: "01 08 * * 1-5" # UTC 08:01 every weekday
  workflow_dispatch: {}

jobs:
  performance:
    name: Performance
    runs-on: ubuntu-latest
    concurrency:
      group: performance-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    container:
      image: vsaglib/vsag:ci-x86-openblas
    env:
      PERF_DINGDING_ACCESS_TOKEN: ${{ secrets.PERF_DINGDING_ACCESS_TOKEN }}
      PERF_DINGDING_SERCRET: ${{ secrets.PERF_DINGDING_SERCRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Deps
        run: pip3 install -r ./scripts/perf_reports/requirements.txt
      - name: Download Datasets
        run: bash ./scripts/download_annbench_datasets.sh
      - name: Build Performance Release
        # Performance benchmarks already run against OpenBLAS (the default
        # backend). Use the pre-installed system OpenBLAS so the BLAS build
        # itself doesn't eat into the daily perf window.
        run: >-
          EXTRA_DEFINED="-DUSE_SYSTEM_OPENBLAS=ON -DENABLE_IO_BENCHMARKS=ON"
          make release-perf VSAG_ENABLE_TOOLS=ON
      - name: Run Perf - Recall 90%, 95%, 99%
        run:  |
          ./build-release-perf/tools/eval/eval_performance .github/perf-mini.yml
      - name: Collect IO Performance Samples
        run: |
          mkdir -p io-performance-results
          ./build-release-perf/benchs/io/io_micro_benchmark 11 \
            > io-performance-results/micro.csv
          ./build-release-perf/benchs/io/io_backend_profile_benchmark 11 all \
            > io-performance-results/backend-profiles.csv
          ./build-release-perf/benchs/io/io_storage_profile_benchmark \
            /tmp/vsag-io-storage-profile.data 11 noncontinuous \
            > io-performance-results/noncontinuous.csv
      - name: Upload IO Performance Samples
        uses: actions/upload-artifact@v4
        with:
          name: io-performance-${{ github.run_id }}
          path: io-performance-results/*.csv
          if-no-files-found: error
          retention-days: 30
      - name: Send Report
        run:  |
          python3 scripts/perf_reports/dingding.py /tmp/github-perf.json || echo "send report to dingding failed"
